[project]
name = "qec"
version = "0.1.0"
description = "A small neural network decoder for the distance-3 surface code, compared with PyMatching on Google's Sycamore data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahyar Jaberi" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pymatching>=2.4.0",
    "sinter>=1.16.0",
    "stim>=1.16.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
